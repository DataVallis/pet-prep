name: CI & Deploy

# Pipeline (2026-10-06, DEPLOYMENT.md D16; manual production deploys D18, 2026-10-14; daily deploy D21):
#   plan ─┬─ backend-tests ───────┐
#         ├─ mobile-checks ───────┤
#         ├─ deploy-script-tests ─┼─ ci-ok (the one required status) ─ deploy (Run workflow, target production)
#         └─ production-image ────┘                                                    └─ mobile-ota (dispatch, D33)
# `plan` (scripts/ci-plan.sh) runs only the suites whose paths changed and, on a push to
# main, skips a suite that already passed in a successful PR run on the identical git
# tree (marker artifacts "ci-green-<suite>-<tree>", uploaded on every event) or proven by the merged
# PR's green run when main moved only elsewhere (D29, ci-plan.sh §3b); a production "Run workflow"
# diffs against the last production deploy and skips every suite green on its tree (D28/D29, §4).
# `ci-ok` fails unless every suite either passed or was skipped because plan said so.
# A push / merge to main runs CI only and deploys NOTHING (David 2026-10-14). Production is
# deployed only by "Run workflow" on main with target = production (scripts/ci-deploy-target.sh),
# which skips the suites already green on the identical tree (D28; input force_tests = test everything): daily at ~03:17 Europe/Ljubljana (GitHub may start it later) by .github/workflows/daily-deploy.yml
# when main has new commits and their push CI is green (D21, David 2026-10-15), or manually by
# David — agents never dispatch it. The deploy job runs only when plan and ci-ok succeeded
# (explicit result checks — see the job) and its first step refuses a re-run of an older commit.
# After a successful deploy the job mobile-ota dispatches "Mobile OTA update" for the deployed
# commit (D33 — also for the daily deploy, whose GITHUB_TOKEN run creates no workflow_run event).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "none = full test run only; production = reuse CI already green on this tree (else test), then deploy to api.petprep.si"
        type: choice
        options:
          - none
          - production
        default: none
      force_tests:
        description: "true = run every suite even if this exact tree is already green (production deploys reuse green CI by default, D28)"
        type: boolean
        default: false

# Dispatch runs (manual production deploys) get their own group: a push run queued behind
# a pending dispatch in the same group would replace it silently (GitHub keeps only one
# pending run per group). The deploy job itself serialises on `production`.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # plan: read runs + marker artifacts of this repository
  pull-requests: read # plan (D29): the merged PR of a push to main

jobs:
  plan:
    name: Plan (changed paths, tested tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      base: ${{ steps.plan.outputs.base }}
      backend: ${{ steps.plan.outputs.backend }}
      mobile: ${{ steps.plan.outputs.mobile }}
      scripts: ${{ steps.plan.outputs.scripts }}
      image: ${{ steps.plan.outputs.image }}
      deploy: ${{ steps.plan.outputs.deploy }}
      image_run: ${{ steps.plan.outputs.image_run }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Checkout Code (full history, no blobs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # production | none (D18): only "Run workflow" with target production deploys.
      - name: Deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          INPUT_TARGET: ${{ inputs.target }}
        run: bash scripts/ci-deploy-target.sh

      # Push runs diff against the last production deploy (which can be several merges
      # back now): only test selection depends on it — fail closed, markers still skip.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: deploy-production.yml
          DEPLOY_TARGET: ${{ steps.target.outputs.target }}
          FORCE_TESTS: ${{ inputs.force_tests == true }}
        run: bash scripts/ci-plan.sh

      # D29: this tree is proven by the merged PR's green run (main moved only elsewhere).
      - name: Upload derived marker (backend)
        if: steps.plan.outputs.derived_backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-backend-${{ steps.plan.outputs.tree }}
          path: ${{ steps.plan.outputs.derived_dir }}/backend/ci-green.txt
          retention-days: 14
          overwrite: true

      # D29: this tree is proven by the merged PR's green run (main moved only elsewhere).
      - name: Upload derived marker (mobile)
        if: steps.plan.outputs.derived_mobile == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-mobile-${{ steps.plan.outputs.tree }}
          path: ${{ steps.plan.outputs.derived_dir }}/mobile/ci-green.txt
          retention-days: 14
          overwrite: true

      # D29: this tree is proven by the merged PR's green run (main moved only elsewhere).
      - name: Upload derived marker (scripts)
        if: steps.plan.outputs.derived_scripts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-scripts-${{ steps.plan.outputs.tree }}
          path: ${{ steps.plan.outputs.derived_dir }}/scripts/ci-green.txt
          retention-days: 14
          overwrite: true

      # D29: this tree is proven by the merged PR's green run (main moved only elsewhere).
      - name: Upload derived marker (image)
        if: steps.plan.outputs.derived_image == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-image-${{ steps.plan.outputs.tree }}
          path: ${{ steps.plan.outputs.derived_dir }}/image/ci-green.txt
          retention-days: 14
          overwrite: true

  # D29 (David 2026-11-02): 6 shards (scripts/ci-pest-shard.mjs, balanced by the measured
  # backend/tests/durations.json) — one runner took 26–28 min. The marker for this tree is
  # uploaded by the job "backend-green" only after EVERY shard passed.
  backend-tests:
    name: Backend tests (Pest on PostgreSQL) ${{ matrix.shard }}/6
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres # superuser: --parallel creates testing_test_1..N itself
      DB_PASSWORD: postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, redis, bcmath, gd, zip, sodium
          coverage: none

      - name: Composer cache dir
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Clip quality check (David 2026-10-23): MediaQualityCheckTest renders tiny MP4 fixtures
      # with ffmpeg and measures them with ffprobe (the tests skip with a reason without it).
      # D24 (David 2026-10-26): no apt any more — `apt-get update` took 25–28 min on 2026-10-23 and
      # on 2026-10-26 (deploy run 40311299855) the apt install hit the 5-min step timeout half-way,
      # Pest failed and nothing was deployed. scripts/ci-install-ffmpeg.sh uses a working runner
      # ffmpeg, else the cached static build, else downloads one (2 sources, 3 tries each with
      # backoff, 6-min deadline) and puts it on PATH only after a real H.264 smoke test. If all
      # fails it warns and the ffmpeg tests skip; the production-image job still proves ffmpeg /
      # ffprobe are in the app image. Harness: scripts/tests/ci-install-ffmpeg.test.sh.
      - name: Restore ffmpeg (static build cache)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/petprep-ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install ffmpeg
        id: ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: bash scripts/ci-install-ffmpeg.sh

      - name: Save ffmpeg (static build cache)
        if: steps.ffmpeg.outputs.source == 'download'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/petprep-ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install PHP Dependencies
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-interaction
          php artisan key:generate

      - name: Shard plan
        run: node scripts/ci-pest-shard.mjs "${{ matrix.shard }}" 6

      # One process per vCPU, each on its own database testing_test_<N> (Laravel
      # ParallelTesting creates and migrates them; Storage::fake() disks are per process too).
      - name: Run Pest (parallel, this shard)
        working-directory: backend
        run: php artisan test --parallel --configuration=phpunit.shard.xml

  # Marker for this tree only when every shard of backend-tests passed (D29).
  backend-green:
    name: Backend tests (all shards)
    needs: [plan, backend-tests]
    if: needs.backend-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record green tree
        env:
          TREE: ${{ needs.plan.outputs.tree }}
          PR_BASE: ${{ github.event_name == 'pull_request' && needs.plan.outputs.base || '' }}
        run: |
          echo "${TREE} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"
          # D29: the PR merge commit's first parent (plan's base in PR mode).
          if [ -n "$PR_BASE" ]; then echo "base=${PR_BASE}" >> "${RUNNER_TEMP}/ci-green.txt"; fi

      - name: Upload green-tree marker
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-backend-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  mobile-checks:
    name: Mobile (tsc + Jest)
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: npx tsc --noEmit

      - name: Jest
        run: yarn test --ci

      - name: Record green tree
        id: green
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "${tree} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"
          # D29: the PR merge commit's first parent = the main the PR was tested on
          # (cat-file: the raw parent line also exists in a depth-1 checkout).
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n1)" >> "${RUNNER_TEMP}/ci-green.txt"
          fi

      - name: Upload green-tree marker
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-mobile-${{ steps.green.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  deploy-script-tests:
    name: Deploy + CI scripts (shellcheck + harnesses)
    needs: plan
    if: needs.plan.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/deploy-production.sh scripts/tests/deploy-production.test.sh scripts/ci-plan.sh scripts/tests/ci-plan.test.sh scripts/ci-deploy-guard.sh scripts/reset-game-data.sh scripts/tests/reset-game-data.test.sh scripts/restore-production-db.sh scripts/backup-production-db.sh scripts/tests/backup-production-db.test.sh scripts/backup-offsite.sh scripts/tests/backup-offsite.test.sh scripts/ci-deploy-target.sh scripts/ci-remote-deploy.sh scripts/ci-image-refs.sh scripts/mobile-ota-plan.sh scripts/tests/mobile-ota-plan.test.sh scripts/mobile-ota.sh scripts/tests/mobile-ota.test.sh scripts/daily-deploy.sh scripts/tests/daily-deploy.test.sh scripts/ci-install-ffmpeg.sh scripts/tests/ci-install-ffmpeg.test.sh

      # Stubbed docker/git/curl in a temp dir; needs only bash, git and rsync.
      - name: Harness (deploy-production.sh)
        run: bash scripts/tests/deploy-production.test.sh

      # Stubbed gh over JSON fixtures, real git + jq; also the deploy guard (bare origin),
      # the dev / production target (D18), the mobile OTA channel plan and the remote deploy step.
      - name: Harness (ci-plan.sh + ci-deploy-guard.sh + D18 routing)
        run: bash scripts/tests/ci-plan.test.sh

      # Stubbed gh over JSON fixtures (real jq filters) + date; D21 daily ~03:17 deploy trigger.
      - name: Harness (daily-deploy.sh)
        run: bash scripts/tests/daily-deploy.test.sh

      # Stubbed curl over fixture .tar.xz archives + fake ffmpeg / ffprobe (D24).
      - name: Harness (ci-install-ffmpeg.sh)
        run: bash scripts/tests/ci-install-ffmpeg.test.sh

      # Stubbed gh over job fixtures (real jq filter): the OTA plan re-reads the CI run's jobs
      # before "without a production deploy" (2026-10-23).
      - name: Harness (mobile-ota-plan.sh)
        run: bash scripts/tests/mobile-ota-plan.test.sh

      # Stubbed eas / npx, real git + node: every OTA carries EXPO_PUBLIC_GIT_COMMIT = short HEAD
      # (the app's »Različica aplikacije«, 2026-10-29), release outputs, dry run.
      - name: Harness (mobile-ota.sh)
        run: bash scripts/tests/mobile-ota.test.sh

      # Stubbed docker + backup script (D17 production reset wrapper).
      - name: Harness (reset-game-data.sh)
        run: bash scripts/tests/reset-game-data.test.sh

      # Stubbed docker; retention must stay top-level and never fail the backup.
      - name: Harness (backup-production-db.sh)
        run: bash scripts/tests/backup-production-db.test.sh

      # Stubbed docker / curl / date; D5 off-site backup (db + pet media via restic).
      - name: Harness (backup-offsite.sh)
        run: bash scripts/tests/backup-offsite.test.sh

      # M5-R11: breed registry export for the website (deterministic, every fact sourced,
      # committed docs/research/breed-registry.json up to date; PHP cross-check when php exists).
      - name: Breed registry export (node --test)
        run: node --test scripts/tests/export-breed-registry.test.mjs

      # M6-K: care knowledge export for the website (food files valid, only verified locales
      # published, committed docs/research/care-knowledge.json up to date).
      - name: Care knowledge export (node --test)
        run: node --test scripts/tests/export-care-knowledge.test.mjs

      # D29: Pest shard planner (every test file in exactly one shard).
      - name: Pest shard plan (node --test)
        run: node --test scripts/tests/ci-pest-shard.test.mjs

      # docs/breeds/README.md index current (one doc per breed, David 2026-10-15).
      - name: Breed docs index (node --test)
        run: node --test scripts/tests/breeds-index.test.mjs

      - name: Record green tree
        id: green
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "${tree} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"
          # D29: the PR merge commit's first parent = the main the PR was tested on
          # (cat-file: the raw parent line also exists in a depth-1 checkout).
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n1)" >> "${RUNNER_TEMP}/ci-green.txt"
          fi

      - name: Upload green-tree marker
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-scripts-${{ steps.green.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  # M4-05b: building the production Dockerfile here catches Dockerfile / composer /
  # Caddyfile breakage in the PR; layers are cached in the GitHub Actions cache.
  # D28 (David 2026-11-02, "deploy max 10 min"): AFTER every check below passed, same-repo
  # runs push the images to GHCR under a per-run tag (be-<backend tree>-<run>-<attempt>) and
  # record their DIGESTS in the green-tree marker; the deploy pulls exactly those digests
  # (never a tag) instead of building on the CX23 (5–6 min). Fork PRs build without pushing.
  production-image:
    name: Production image (build + smoke test, push to GHCR)
    needs: plan
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.push.outputs.app }}
      web: ${{ steps.push.outputs.web }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Image coordinates
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -eu
          {
            echo "registry=ghcr.io/${OWNER,,}"
            echo "tag=be-$(git rev-parse HEAD:backend)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "push=${SAME_REPO}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.img.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/docker/production/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Base ids for the server's reverb / caddy fingerprints (D19), carried as the label
      # org.petprep.base-id — the server has no build cache to resolve them itself.
      - name: Build PHP base stage (cache hit)
        id: phpbase
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/production/Dockerfile
          target: base
          push: false
          load: true
          tags: petprep-base:ci
          cache-from: type=gha,scope=petprep-production

      - name: Base ids
        id: base
        env:
          APP_BASE: ${{ steps.phpbase.outputs.imageid }}
        run: |
          set -eu
          docker pull -q caddy:2.8-alpine > /dev/null
          echo "app=${APP_BASE}" >> "$GITHUB_OUTPUT"
          echo "web=$(docker image inspect --format '{{.Id}}' caddy:2.8-alpine)" >> "$GITHUB_OUTPUT"

      - name: Build app image (php-fpm + code + vendor)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/production/Dockerfile
          target: app
          push: false
          load: true
          tags: petprep-app:ci
          labels: |
            org.petprep.base-id=${{ steps.base.outputs.app }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=petprep-production
          cache-to: type=gha,mode=max,scope=petprep-production

      - name: Build web image (Caddy + public/)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/production/Dockerfile
          target: web
          push: false
          load: true
          tags: petprep-web:ci
          labels: |
            org.petprep.base-id=${{ steps.base.outputs.web }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=petprep-production

      # D18: one Caddyfile for both servers. Production = the defaults (no env), exactly as
      # compose passes them on api.petprep.si; a second API-only server (dev server, postponed)
      # = api-dev.petprep.si + site set api-only,
      # which must not serve (or request certificates for) petprep.si / www / the raw IP.
      - name: Validate the Caddyfile with the production Caddy image (production + dev)
        run: |
          set -eu
          cf="$PWD/deployment/Caddyfile"
          docker run --rm -v "$cf:/etc/caddy/Caddyfile:ro" petprep-web:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$cf:/etc/caddy/Caddyfile:ro" petprep-web:ci \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > prod.json
          docker run --rm -e PETPREP_API_DOMAIN=api-dev.petprep.si -e PETPREP_CADDY_SITES=api-only \
            -v "$cf:/etc/caddy/Caddyfile:ro" petprep-web:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e PETPREP_API_DOMAIN=api-dev.petprep.si -e PETPREP_CADDY_SITES=api-only \
            -v "$cf:/etc/caddy/Caddyfile:ro" petprep-web:ci \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > dev.json
          hosts() { jq -c '[.apps.http.servers[].routes[].match[]?.host[]?] | sort' "$1"; }
          echo "production hosts: $(hosts prod.json)"; echo "dev hosts: $(hosts dev.json)"
          test "$(hosts prod.json)" = '["138.199.172.97","api.petprep.si","petprep.si","www.petprep.si"]'
          test "$(hosts dev.json)" = '["api-dev.petprep.si"]'
          # D19: every FastCGI upstream to app:9000 retries during the app swap (2 sites).
          test "$(jq '[.. | objects | select(.load_balancing? .try_duration == 10000000000)] | length' prod.json)" = 2

      - name: Smoke test the app image
        run: |
          set -eux
          test "$(docker run --rm petprep-app:ci id -u)" = 1000
          # Clip quality check (David 2026-10-23): ffmpeg + ffprobe in the app image.
          docker run --rm --entrypoint sh petprep-app:ci -c 'ffmpeg -hide_banner -version > /dev/null && ffprobe -hide_banner -version > /dev/null'
          docker run --rm --entrypoint php-fpm petprep-app:ci -t
          # Every extension the app needs (OPcache is listed as "Zend OPcache").
          docker run --rm --entrypoint php petprep-app:ci -m > php-modules.txt
          for ext in sodium pcntl gd exif pdo_pgsql redis intl zip bcmath "Zend OPcache"; do
            grep -qx "$ext" php-modules.txt || { echo "missing PHP extension: $ext"; exit 1; }
          done
          # No dev packages (Pest is require-dev since M0-07), no secrets, no tests in the image.
          docker run --rm --entrypoint sh petprep-app:ci -c '! test -e vendor/fakerphp && ! test -e vendor/pestphp && ! test -e .env && ! test -e tests'
          # The entrypoint builds every cache (config, events, routes, views, Filament).
          docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" -e CACHE_STORE=array \
            -e SESSION_DRIVER=array -e PETPREP_OPTIMIZE=full petprep-app:ci php artisan route:list --path=api/media

      # Only now — every check above passed. Digests, not tags, identify what was tested.
      - name: Push to GHCR (after the checks)
        id: push
        if: steps.img.outputs.push == 'true'
        env:
          REG: ${{ steps.img.outputs.registry }}
          TAG: ${{ steps.img.outputs.tag }}
        run: |
          set -eu
          for i in app web; do
            ref="${REG}/petprep-${i}:${TAG}"
            docker tag "petprep-${i}:ci" "$ref"
            docker push -q "$ref" > /dev/null
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep -m1 "^${REG}/petprep-${i}@sha256:")"
            echo "${i}=${digest}" >> "$GITHUB_OUTPUT"
            echo "pushed ${digest}"
          done

      # Retention (D28): every same-repo run pushes a version; keep the newest 60 per image
      # (markers live 14 days — an older digest is gone → that deploy builds on the server).
      - name: Prune old GHCR versions
        if: steps.push.outcome == 'success' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: petprep-app
          package-type: container
          min-versions-to-keep: 60

      - name: Prune old GHCR versions (web)
        if: steps.push.outcome == 'success' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: petprep-web
          package-type: container
          min-versions-to-keep: 60

      - name: Record green tree
        id: green
        env:
          APP_DIGEST: ${{ steps.push.outputs.app }}
          WEB_DIGEST: ${{ steps.push.outputs.web }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "${tree} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"
          # D29: the PR merge commit's first parent = the main the PR was tested on
          # (cat-file: the raw parent line also exists in a depth-1 checkout).
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n1)" >> "${RUNNER_TEMP}/ci-green.txt"
          fi
          # D28: the deploy reads the digests from this marker (empty for fork PRs → server build).
          printf 'app=%s\nweb=%s\n' "$APP_DIGEST" "$WEB_DIGEST" >> "${RUNNER_TEMP}/ci-green.txt"

      - name: Upload green-tree marker
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-image-${{ steps.green.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  # The single status for branch protection / the merge helper: always reported, green
  # only when plan succeeded and every suite passed or was skipped BY THE PLAN. A suite
  # that failed, was cancelled, or was skipped although planned makes it red.
  ci-ok:
    name: CI OK
    if: always()
    needs: [plan, backend-tests, backend-green, mobile-checks, deploy-script-tests, production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_BACKEND: ${{ needs.plan.outputs.backend }}
          PLAN_MOBILE: ${{ needs.plan.outputs.mobile }}
          PLAN_SCRIPTS: ${{ needs.plan.outputs.scripts }}
          PLAN_IMAGE: ${{ needs.plan.outputs.image }}
          # Matrix result = failure if any shard failed; the marker job must have run too.
          BACKEND_RESULT: ${{ needs.backend-tests.result == 'success' && needs.backend-green.result || needs.backend-tests.result }}
          MOBILE_RESULT: ${{ needs.mobile-checks.result }}
          SCRIPTS_RESULT: ${{ needs.deploy-script-tests.result }}
          IMAGE_RESULT: ${{ needs.production-image.result }}
        run: |
          set -u
          ok=1
          if [ "$PLAN_RESULT" != success ]; then echo "plan: $PLAN_RESULT"; ok=0; fi
          verdict() { # verdict NAME PLANNED RESULT
            if [ "$3" = success ]; then echo "$1: passed"
            elif [ "$3" = skipped ] && [ "$2" = false ]; then echo "$1: skipped (not needed / already green on this tree)"
            else echo "::error::$1: result '$3' (planned: '$2')"; ok=0; fi
          }
          verdict backend-tests "$PLAN_BACKEND" "$BACKEND_RESULT"
          verdict mobile-checks "$PLAN_MOBILE" "$MOBILE_RESULT"
          verdict deploy-script-tests "$PLAN_SCRIPTS" "$SCRIPTS_RESULT"
          verdict production-image "$PLAN_IMAGE" "$IMAGE_RESULT"
          [ "$ok" = 1 ]

  # D18 (David 2026-10-14): manual production deploys. Only "Run workflow" on main with
  # input target = production deploys (scripts/ci-deploy-target.sh); a push / merge to main
  # runs CI only. EXPLICIT status checks, NOT the implicit success(): GitHub's job-level
  # success() looks at every upstream job transitively, so suites that plan skipped (behind
  # ci-ok) skipped the deploy even with ci-ok green (run 37467604915, 2026-10-06).
  # !cancelled() lets it be evaluated; it runs only when plan AND ci-ok themselves
  # succeeded — ci-ok is red whenever a suite failed, was cancelled or was skipped against
  # the plan.
  deploy:
    # The job name marks a deployed main run for scripts/ci-plan.sh — keep it.
    name: Deploy to Hetzner Production
    needs: [plan, ci-ok, production-image]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.ci-ok.result == 'success' &&
      needs.plan.outputs.deploy == 'true' && needs.plan.outputs.target == 'production' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://api.petprep.si
    permissions:
      contents: read
      actions: read # the image digests from the green marker of the run that tested this tree (D28)
      packages: read # the server pulls the CI images with this job's token (D28)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Refuses (red, not skipped) when this run's commit is no longer the head of main —
      # every re-run; "Run workflow" (attempt 1) is not checked. Rollback = revert commit
      # on main, then "Run workflow" → target production (DEPLOYMENT.md D16).
      - name: Deploy guard (commit is still the head of main)
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/ci-deploy-guard.sh

      # D28: digests from this run's image job, else from the marker of the run that tested
      # this tree (plan.image_run); none → the server builds (old path). Never a tag.
      - name: Image digests (CI-built, tested)
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TREE: ${{ needs.plan.outputs.tree }}
          RUN_APP: ${{ needs.production-image.outputs.app }}
          RUN_WEB: ${{ needs.production-image.outputs.web }}
          MARKER_RUN: ${{ needs.plan.outputs.image_run }}
        run: bash scripts/ci-image-refs.sh

      - name: Upload + deploy-production.sh on the production server
        env:
          TARGET: production
          KEY_SECRET: PRODUCTION_SSH_PRIVATE_KEY
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST || '138.199.172.97' }}
          SSH_USER: ${{ secrets.PRODUCTION_USER || 'deploy' }}
          EXPECT_DOMAIN: api.petprep.si
          COMMIT_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ steps.images.outputs.app }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-remote-deploy.sh

  # D33 (2026-11-04): the OTA must follow EVERY production deploy. mobile-ota.yml's
  # workflow_run trigger fires only for runs started with a user token; the daily deploy
  # starts this workflow with GITHUB_TOKEN, which creates no workflow_run event, so its OTA
  # never ran (deploy 41807838886, bb3450c9). This job dispatches the OTA explicitly
  # (workflow_dispatch from GITHUB_TOKEN is allowed) for exactly this run's deployed commit;
  # mobile-ota-plan.sh checks the run, the commit and the deploy job, and publishes once per
  # commit (a manual deploy also fires workflow_run). continue-on-error: a failed dispatch
  # must not turn the deploy run red — ci-plan.sh, daily-deploy.sh and the OTA plan find the
  # last production deploy among the SUCCESSFUL Run workflow runs.
  mobile-ota:
    name: Mobile OTA (after the production deploy)
    needs: [deploy]
    if: needs.deploy.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # gh workflow run mobile-ota.yml
    steps:
      - name: Dispatch mobile-ota.yml (channel production, this deployed commit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if ! gh workflow run mobile-ota.yml --repo "$REPO" --ref main \
               -f channel=production -f dry_run=false -f deploy_run_id="$RUN_ID" -f sha="$SHA"; then
            echo "::error title=Mobile OTA not started::dispatch failed — start it by hand: Actions → Mobile OTA update → Run workflow, channel production"
            echo "**Mobile OTA not started** — Actions → Mobile OTA update → Run workflow, channel production." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Dispatched \"Mobile OTA after production deploy ${RUN_ID}\" for ${SHA:0:7} (channel production; it publishes only if mobile/ changed since the last release)." | tee -a "$GITHUB_STEP_SUMMARY"
