name: CI & Deploy

# Pipeline (2026-10-06, DEPLOYMENT.md D16):
#   plan ─┬─ backend-tests ───────┐
#         ├─ mobile-checks ───────┤
#         ├─ deploy-script-tests ─┼─ ci-ok (the one required status) ─ deploy (main only)
#         └─ production-image ────┘
# `plan` (scripts/ci-plan.sh) runs only the suites whose paths changed and, on a push to
# main, skips a suite that already passed in a successful PR run on the identical git
# tree (marker artifacts "ci-green-<suite>-<tree>", uploaded below on pull_request).
# `ci-ok` fails unless every suite either passed or was skipped because plan said so.
# `deploy` runs only when plan and ci-ok succeeded (explicit result checks — see the job)
# and only when backend/, deployment/, scripts/ or this file changed since the last main
# run that really deployed, or on "Run workflow";
# its first step refuses a commit that is no longer the head of main.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # plan: read runs + marker artifacts of this repository

jobs:
  plan:
    name: Plan (changed paths, tested tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      backend: ${{ steps.plan.outputs.backend }}
      mobile: ${{ steps.plan.outputs.mobile }}
      scripts: ${{ steps.plan.outputs.scripts }}
      image: ${{ steps.plan.outputs.image }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Checkout Code (full history, no blobs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: deploy-production.yml
        run: bash scripts/ci-plan.sh

  backend-tests:
    name: Backend tests (Pest on PostgreSQL)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres # superuser: --parallel creates testing_test_1..N itself
      DB_PASSWORD: postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, redis, bcmath, gd, zip, sodium
          coverage: none

      - name: Composer cache dir
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install PHP Dependencies
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-interaction
          php artisan key:generate

      # One process per vCPU, each on its own database testing_test_<N> (Laravel
      # ParallelTesting creates and migrates them; Storage::fake() disks are per process too).
      - name: Run Pest (parallel)
        working-directory: backend
        run: php artisan test --parallel

      - name: Record green tree
        id: green
        if: github.event_name == 'pull_request'
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "${tree} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"

      - name: Upload green-tree marker
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-backend-${{ steps.green.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  mobile-checks:
    name: Mobile (tsc + Jest)
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: npx tsc --noEmit

      - name: Jest
        run: yarn test --ci

      - name: Record green tree
        id: green
        if: github.event_name == 'pull_request'
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "${tree} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"

      - name: Upload green-tree marker
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-mobile-${{ steps.green.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  deploy-script-tests:
    name: Deploy + CI scripts (shellcheck + harnesses)
    needs: plan
    if: needs.plan.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/deploy-production.sh scripts/tests/deploy-production.test.sh scripts/ci-plan.sh scripts/tests/ci-plan.test.sh scripts/ci-deploy-guard.sh scripts/reset-game-data.sh scripts/tests/reset-game-data.test.sh scripts/restore-production-db.sh scripts/backup-production-db.sh scripts/tests/backup-production-db.test.sh

      # Stubbed docker/git/curl in a temp dir; needs only bash, git and rsync.
      - name: Harness (deploy-production.sh)
        run: bash scripts/tests/deploy-production.test.sh

      # Stubbed gh over JSON fixtures, real git + jq; also the deploy guard (bare origin).
      - name: Harness (ci-plan.sh + ci-deploy-guard.sh)
        run: bash scripts/tests/ci-plan.test.sh

      # Stubbed docker + backup script (D17 production reset wrapper).
      - name: Harness (reset-game-data.sh)
        run: bash scripts/tests/reset-game-data.test.sh

      # Stubbed docker; retention must stay top-level and never fail the backup.
      - name: Harness (backup-production-db.sh)
        run: bash scripts/tests/backup-production-db.test.sh

      # M5-R11: breed registry export for the website (deterministic, every fact sourced,
      # committed docs/research/breed-registry.json up to date; PHP cross-check when php exists).
      - name: Breed registry export (node --test)
        run: node --test scripts/tests/export-breed-registry.test.mjs

      - name: Record green tree
        id: green
        if: github.event_name == 'pull_request'
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "${tree} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"

      - name: Upload green-tree marker
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-scripts-${{ steps.green.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  # M4-05b: the server builds the same Dockerfile on every deploy (before maintenance
  # mode) and smoke-tests it there too. Building it here first catches Dockerfile /
  # composer / Caddyfile breakage in the PR. Nothing is pushed; layers are cached in the
  # GitHub Actions cache.
  production-image:
    name: Production image (build + smoke test, no push)
    needs: plan
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/docker/production/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (php-fpm + code + vendor)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/production/Dockerfile
          target: app
          push: false
          load: true
          tags: petprep-app:ci
          cache-from: type=gha,scope=petprep-production
          cache-to: type=gha,mode=max,scope=petprep-production

      - name: Build web image (Caddy + public/)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/production/Dockerfile
          target: web
          push: false
          load: true
          tags: petprep-web:ci
          cache-from: type=gha,scope=petprep-production

      - name: Validate the Caddyfile with the production Caddy image
        run: |
          docker run --rm -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" petprep-web:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Smoke test the app image
        run: |
          set -eux
          test "$(docker run --rm petprep-app:ci id -u)" = 1000
          docker run --rm --entrypoint php-fpm petprep-app:ci -t
          # Every extension the app needs (OPcache is listed as "Zend OPcache").
          docker run --rm --entrypoint php petprep-app:ci -m > php-modules.txt
          for ext in sodium pcntl gd exif pdo_pgsql redis intl zip bcmath "Zend OPcache"; do
            grep -qx "$ext" php-modules.txt || { echo "missing PHP extension: $ext"; exit 1; }
          done
          # No dev packages, no secrets, no tests in the image.
          docker run --rm --entrypoint sh petprep-app:ci -c '! test -e vendor/fakerphp && ! test -e .env && ! test -e tests'
          # The entrypoint builds every cache (config, events, routes, views, Filament).
          docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" -e CACHE_STORE=array \
            -e SESSION_DRIVER=array -e PETPREP_OPTIMIZE=full petprep-app:ci php artisan route:list --path=api/media

      - name: Record green tree
        id: green
        if: github.event_name == 'pull_request'
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "${tree} ${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ci-green.txt"

      - name: Upload green-tree marker
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-image-${{ steps.green.outputs.tree }}
          path: ${{ runner.temp }}/ci-green.txt
          retention-days: 14
          overwrite: true

  # The single status for branch protection / the merge helper: always reported, green
  # only when plan succeeded and every suite passed or was skipped BY THE PLAN. A suite
  # that failed, was cancelled, or was skipped although planned makes it red.
  ci-ok:
    name: CI OK
    if: always()
    needs: [plan, backend-tests, mobile-checks, deploy-script-tests, production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_BACKEND: ${{ needs.plan.outputs.backend }}
          PLAN_MOBILE: ${{ needs.plan.outputs.mobile }}
          PLAN_SCRIPTS: ${{ needs.plan.outputs.scripts }}
          PLAN_IMAGE: ${{ needs.plan.outputs.image }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          MOBILE_RESULT: ${{ needs.mobile-checks.result }}
          SCRIPTS_RESULT: ${{ needs.deploy-script-tests.result }}
          IMAGE_RESULT: ${{ needs.production-image.result }}
        run: |
          set -u
          ok=1
          if [ "$PLAN_RESULT" != success ]; then echo "plan: $PLAN_RESULT"; ok=0; fi
          verdict() { # verdict NAME PLANNED RESULT
            if [ "$3" = success ]; then echo "$1: passed"
            elif [ "$3" = skipped ] && [ "$2" = false ]; then echo "$1: skipped (not needed / already green on the PR)"
            else echo "::error::$1: result '$3' (planned: '$2')"; ok=0; fi
          }
          verdict backend-tests "$PLAN_BACKEND" "$BACKEND_RESULT"
          verdict mobile-checks "$PLAN_MOBILE" "$MOBILE_RESULT"
          verdict deploy-script-tests "$PLAN_SCRIPTS" "$SCRIPTS_RESULT"
          verdict production-image "$PLAN_IMAGE" "$IMAGE_RESULT"
          [ "$ok" = 1 ]

  deploy:
    name: Deploy to Hetzner Production
    needs: [plan, ci-ok]
    # Explicit status checks, NOT the implicit success(): GitHub's job-level success()
    # looks at every upstream job transitively, so suites that plan skipped (behind ci-ok)
    # skipped this job even with ci-ok green (run 37467604915, 2026-10-06). !cancelled()
    # lets it be evaluated; it runs only when plan AND ci-ok themselves succeeded — ci-ok
    # is red whenever a suite failed, was cancelled or was skipped against the plan.
    # Pre-production phase (David, 2026-10-03): every push/merge to main that changes
    # backend/, deployment/, scripts/ or this workflow deploys automatically once ci-ok is
    # green; "Run workflow" on main always tests everything and deploys. To require manual
    # deploys again, restrict this to workflow_dispatch — see docs/engineering/DEPLOYMENT.md D2.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.ci-ok.result == 'success' &&
      needs.plan.outputs.deploy == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://api.petprep.si
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Refuses (red, not skipped) when this run's commit is no longer the head of main —
      # push runs and every re-run; "Run workflow" (attempt 1) is not checked. Rollback =
      # revert commit or "Run workflow" on main (DEPLOYMENT.md D16).
      - name: Deploy guard (commit is still the head of main)
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/ci-deploy-guard.sh

      - name: Setup SSH Key & Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST || '138.199.172.97' }}
          SSH_USER: ${{ secrets.PRODUCTION_USER || 'deploy' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: PRODUCTION_SSH_PRIVATE_KEY secret is not set in GitHub repository settings."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add remote host key to known_hosts safely
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Upload to a staging dir, NOT into /opt/petprep/repo: the containers bind-mount
          # repo/, so writing there would switch the running app to the new code before
          # maintenance mode and migrations. deploy-production.sh syncs incoming/ → repo/
          # inside the maintenance window and reverts on a pre-migration failure.
          echo "1. Uploading exact commit files to the staging dir on the production server..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p /opt/petprep/incoming"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.idea' \
            --exclude 'backend/storage' \
            --exclude 'backend/vendor' \
            --exclude 'mobile/node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ "${SSH_USER}@${SSH_HOST}:/opt/petprep/incoming/"

          echo "2. Triggering production deployment script for commit: $COMMIT_SHA..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
            "/opt/petprep/incoming/scripts/deploy-production.sh --from /opt/petprep/incoming $COMMIT_SHA"
