name: Mobile OTA update

# M5-F10 (David 2026-10-12): after a green "CI & Deploy" run on main that changed mobile/,
# publish an over-the-air update when the native fingerprint matches an existing store
# build; otherwise say that a new store build is needed (scripts/mobile-ota.sh).
# Store builds stay manual (David owns app identity and versions).

on:
  workflow_run:
    workflows: ['CI & Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report OTA vs store build, publish nothing'
        type: boolean
        default: false

concurrency:
  group: mobile-ota
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ota:
    name: OTA update or store build?
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Did mobile/ change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD^1 HEAD -- mobile/; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No EXPO_TOKEN yet
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN == ''
        run: echo "::notice title=Mobile OTA skipped::Add the EXPO_TOKEN repository secret (EAS robot token) to enable OTA updates."

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install mobile dependencies
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        working-directory: mobile
        run: yarn install --frozen-lockfile --non-interactive

      - uses: expo/expo-github-action@v8
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: OTA update or store build
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scripts/mobile-ota.sh "$msg" --dry-run
          else
            scripts/mobile-ota.sh "$msg"
          fi
