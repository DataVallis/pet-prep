name: Mobile OTA update

# M5-F10 (David 2026-10-12): after a green "CI & Deploy" run on main that changed mobile/,
# publish an over-the-air update when the native fingerprint matches an existing build of
# the channel; otherwise say that a new build is needed (scripts/mobile-ota.sh).
# Store builds stay manual (David owns app identity and versions).
#
# Manual production releases (D18, David 2026-10-14) — scripts/mobile-ota-plan.sh:
#   a push / merge to main publishes NOTHING; the `production` channel is published only
#   after "CI & Deploy" → Run workflow → target production whose production deploy
#   succeeded (exactly the deployed commit, if mobile/ changed since the last release in
#   docs/research/app-release.json), or by this workflow's own Run workflow with an
#   explicit channel.
#
# Two triggers follow a production deploy (D33, 2026-11-04):
#   - workflow_run: GitHub creates it only when the CI run was started with a user token
#     (a manual Run workflow), and then sometimes minutes late (deploy 41880114612 finished
#     17:49:40Z, its workflow_run OTA 41881107754 was created 17:51:22Z) — NOT relied upon. The daily deploy (daily-deploy.yml) starts CI & Deploy
#     with GITHUB_TOKEN, which creates NO workflow_run event — its OTA never ran (daily
#     deploy 41806778939 → deploy 41807838886 on bb3450c9, no OTA; M6-W03 app half stuck).
#   - workflow_dispatch with deploy_run_id + sha: CI & Deploy's job "Mobile OTA (after the
#     production deploy)" dispatches this after EVERY successful production deploy
#     (workflow_dispatch from GITHUB_TOKEN is allowed).
#   A manual deploy fires both; the plan publishes once per deployed commit (it reads the
#   release record from the current main and skips a commit that is already released).

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_run_id != '' && format('Mobile OTA after production deploy {0}', inputs.deploy_run_id) || 'Mobile OTA update' }}

on:
  workflow_run:
    workflows: ['CI & Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS channel to publish to: production (store builds — only the commit production runs) or preview (internal builds of the eas.json preview profile)'
        type: choice
        required: true
        options:
          - preview
          - production
        default: preview
      dry_run:
        description: 'Only report OTA vs store build, publish nothing'
        type: boolean
        default: false
      deploy_run_id:
        description: 'Set by CI & Deploy after a successful production deploy (D33) — leave empty for a manual run'
        type: string
        required: false
        default: ''
      sha:
        description: 'With deploy_run_id: the deployed commit (checked against that run) — leave empty for a manual run'
        type: string
        required: false
        default: ''

# Publishing runs queue one after another (GitHub keeps ONE pending run per group and cancels
# an older pending one). The no-op runs after every push CI get their own group (D33), so they
# can never replace a pending OTA that follows a production deploy.
concurrency:
  group: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') && format('mobile-ota-push-{0}', github.run_id) || 'mobile-ota' }}
  cancel-in-progress: false

permissions:
  contents: write   # only to record a published OTA in docs/research/app-release.json (see the last step)
  actions: read     # plan: did the CI run's production deploy job succeed? (D18)

jobs:
  ota:
    name: OTA update or store build?
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # Full history without blobs: the production plan diffs mobile/ against the commit of
      # the last production release (docs/research/app-release.json). Dispatch from CI &
      # Deploy (D33): the deployed commit (inputs.sha) — the plan refuses it unless it is the
      # head_sha of run deploy_run_id.
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      # Channel + "did mobile/ change?" (scripts/mobile-ota-plan.sh). After a production
      # deploy: exactly the deployed commit, if mobile/ changed since the last release and it
      # is not released yet (D33: one publish per deployed commit).
      # Manual runs publish only the current head of main (dry runs excepted).
      - name: Plan (channel, did mobile/ change?)
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/mobile-ota-plan.sh

      - name: No EXPO_TOKEN yet
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN == ''
        run: echo "::notice title=Mobile OTA skipped::Add the EXPO_TOKEN repository secret (EAS robot token) to enable OTA updates."

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install mobile dependencies
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        working-directory: mobile
        run: yarn install --frozen-lockfile --non-interactive

      - uses: expo/expo-github-action@v8
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: OTA update or store build
        id: ota
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        env:
          CHANNEL: ${{ steps.changed.outputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [ "$DRY_RUN" = "true" ]; then
            scripts/mobile-ota.sh "$msg" --channel "$CHANNEL" --dry-run
          else
            scripts/mobile-ota.sh "$msg" --channel "$CHANNEL"
          fi

      # David 2026-10-13: the website must show only what users really have. After a PRODUCTION
      # OTA reached at least one platform (David 2026-10-25: iOS or Android is enough —
      # mobile-ota.sh sets `released` only for the production channel; a preview update is never
      # a release), record the published commit's breeds; the register export marks them in_app
      # (until then they are coming_soon). Docs-only commit by GITHUB_TOKEN → triggers no
      # workflow (no CI / deploy / OTA loop). The website pulls the new breed-registry.json by
      # itself within the hour (pet-prep-website .github/workflows/registry-sync.yml).
      - name: Record the release for the website register
        if: steps.ota.outputs.released == 'true'
        env:
          SHA: ${{ steps.changed.outputs.sha }}
          PLATFORMS: ${{ steps.ota.outputs.platforms }}
        run: |
          git fetch -q --depth=50 origin main
          git checkout -q -B main origin/main
          node scripts/record-app-release.mjs --kind ota --commit "$SHA"
          node scripts/export-breed-registry.mjs
          if git diff --quiet -- docs/research/app-release.json docs/research/breed-registry.json; then
            echo "Release already recorded."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/app-release.json docs/research/breed-registry.json
          git commit -q -m "chore(release): record OTA $(git rev-parse --short "$SHA") (${PLATFORMS}) in app-release.json [skip ci]"
          git push -q origin main
          echo "- 🌐 Recorded in \`docs/research/app-release.json\` (${PLATFORMS}) — petprep.si picks it up within the hour (website registry-sync.yml)" >>"$GITHUB_STEP_SUMMARY"
