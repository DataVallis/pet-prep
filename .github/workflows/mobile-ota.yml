name: Mobile OTA update

# M5-F10 (David 2026-10-12): after a green "CI & Deploy" run on main that changed mobile/,
# publish an over-the-air update when the native fingerprint matches an existing build of
# the channel; otherwise say that a new build is needed (scripts/mobile-ota.sh).
# Store builds stay manual (David owns app identity and versions).
#
# Manual production releases (D18, David 2026-10-14) — scripts/mobile-ota-plan.sh:
#   a push / merge to main publishes NOTHING; the `production` channel is published only
#   after "CI & Deploy" → Run workflow → target production whose production deploy
#   succeeded (exactly the deployed commit, if mobile/ changed since the last release in
#   docs/research/app-release.json), or by this workflow's own Run workflow with an
#   explicit channel.

on:
  workflow_run:
    workflows: ['CI & Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS channel to publish to: production (store builds) or preview (internal builds of the eas.json preview profile)'
        type: choice
        options:
          - production
          - preview
        default: production
      dry_run:
        description: 'Only report OTA vs store build, publish nothing'
        type: boolean
        default: false

concurrency:
  group: mobile-ota
  cancel-in-progress: false

permissions:
  contents: write   # only to record a published OTA in docs/research/app-release.json (see the last step)
  actions: read     # plan: did the CI run's production deploy job succeed? (D18)

jobs:
  ota:
    name: OTA update or store build?
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # Full history without blobs: the production plan diffs mobile/ against the commit of
      # the last production release (docs/research/app-release.json).
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      # Channel + "did mobile/ change?" (scripts/mobile-ota-plan.sh). After a production
      # deploy: exactly the deployed commit, if mobile/ changed since the last release.
      # Manual runs publish only the current head of main (dry runs excepted).
      - name: Plan (channel, did mobile/ change?)
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/mobile-ota-plan.sh

      - name: No EXPO_TOKEN yet
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN == ''
        run: echo "::notice title=Mobile OTA skipped::Add the EXPO_TOKEN repository secret (EAS robot token) to enable OTA updates."

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install mobile dependencies
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        working-directory: mobile
        run: yarn install --frozen-lockfile --non-interactive

      - uses: expo/expo-github-action@v8
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: OTA update or store build
        id: ota
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        env:
          CHANNEL: ${{ steps.changed.outputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [ "$DRY_RUN" = "true" ]; then
            scripts/mobile-ota.sh "$msg" --channel "$CHANNEL" --dry-run
          else
            scripts/mobile-ota.sh "$msg" --channel "$CHANNEL"
          fi

      # David 2026-10-13: the website must show only what users really have. After a PRODUCTION
      # OTA reached iOS AND Android (mobile-ota.sh sets `released` only for the production
      # channel — a preview update is never a release), record the
      # published commit's breeds; the next register export marks them
      # in_app (until then they are coming_soon). Docs-only commit by GITHUB_TOKEN → triggers no
      # workflow (no CI / deploy / OTA loop). The website follows with its next registry sync PR.
      - name: Record the release for the website register
        if: steps.ota.outputs.released == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch -q --depth=50 origin main
          git checkout -q -B main origin/main
          node scripts/record-app-release.mjs --kind ota --commit "$SHA"
          node scripts/export-breed-registry.mjs
          if git diff --quiet -- docs/research/app-release.json docs/research/breed-registry.json; then
            echo "Release already recorded."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/app-release.json docs/research/breed-registry.json
          git commit -q -m "chore(release): record OTA $(git rev-parse --short "$SHA") in app-release.json [skip ci]"
          git push -q origin main
          echo "- 🌐 Recorded in \`docs/research/app-release.json\` — sync the website register (ADD_BREED_RUNBOOK §9b)" >>"$GITHUB_STEP_SUMMARY"
