name: Mobile OTA update

# M5-F10 (David 2026-10-12): after a green "CI & Deploy" run on main that changed mobile/,
# publish an over-the-air update when the native fingerprint matches an existing store
# build; otherwise say that a new store build is needed (scripts/mobile-ota.sh).
# Store builds stay manual (David owns app identity and versions).

on:
  workflow_run:
    workflows: ['CI & Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report OTA vs store build, publish nothing'
        type: boolean
        default: false

concurrency:
  group: mobile-ota
  cancel-in-progress: false

permissions:
  contents: write   # only to record a published OTA in docs/research/app-release.json (see the last step)

jobs:
  ota:
    name: OTA update or store build?
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # Publishes only the current head of main: a re-run of an old CI run or a dispatch
      # from another branch never overwrites a newer production update (dry runs excepted).
      # Change detection diffs against the first parent — main moves by PR merges; a direct
      # push of several commits is covered only for its last commit (use Run workflow).
      - name: Did mobile/ change on the head of main?
        id: changed
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git fetch -q --depth=1 origin main
          if [ "$DRY_RUN" != "true" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice title=Mobile OTA skipped::$(git rev-parse --short HEAD) is not the head of main."
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD^1 HEAD -- mobile/; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No EXPO_TOKEN yet
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN == ''
        run: echo "::notice title=Mobile OTA skipped::Add the EXPO_TOKEN repository secret (EAS robot token) to enable OTA updates."

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install mobile dependencies
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        working-directory: mobile
        run: yarn install --frozen-lockfile --non-interactive

      - uses: expo/expo-github-action@v8
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: OTA update or store build
        id: ota
        if: steps.changed.outputs.mobile == 'true' && env.EXPO_TOKEN != ''
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scripts/mobile-ota.sh "$msg" --dry-run
          else
            scripts/mobile-ota.sh "$msg"
          fi

      # David 2026-10-13: the website must show only what users really have. After an OTA reached
      # iOS AND Android, record the published commit's breeds; the next register export marks them
      # in_app (until then they are coming_soon). Docs-only commit by GITHUB_TOKEN → triggers no
      # workflow (no CI / deploy / OTA loop). The website follows with its next registry sync PR.
      - name: Record the release for the website register
        if: steps.ota.outputs.released == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch -q --depth=50 origin main
          git checkout -q -B main origin/main
          node scripts/record-app-release.mjs --kind ota --commit "$SHA"
          node scripts/export-breed-registry.mjs
          if git diff --quiet -- docs/research/app-release.json docs/research/breed-registry.json; then
            echo "Release already recorded."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/app-release.json docs/research/breed-registry.json
          git commit -q -m "chore(release): record OTA $(git rev-parse --short "$SHA") in app-release.json [skip ci]"
          git push -q origin main
          echo "- 🌐 Recorded in \`docs/research/app-release.json\` — sync the website register (ADD_BREED_RUNBOOK §9b)" >>"$GITHUB_STEP_SUMMARY"
