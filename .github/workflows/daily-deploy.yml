name: Daily production deploy

# D21 (David 2026-10-15): every day at 06:00 Europe/Ljubljana, deploy production when main has
# commits production does not run yet AND the push CI ("CI & Deploy") of the main head is
# green — by starting exactly the manual path: CI & Deploy → Run workflow on main, target
# production (full tests, deploy guard, deploy job, mobile OTA chain unchanged). Logic and
# rules: scripts/daily-deploy.sh (harness scripts/tests/daily-deploy.test.sh).
# GitHub cron is UTC only: 04:00 UTC = 06:00 CEST, 05:00 UTC = 06:00 CET; the script lets
# only the matching one through. Turn it off: Actions → Daily production deploy → Disable workflow.

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the decision, dispatch nothing (false = deploy now if main is new and its push CI is green)'
        type: boolean
        default: true

concurrency:
  group: daily-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # gh workflow run deploy-production.yml (workflow_dispatch)

jobs:
  daily-deploy:
    name: Deploy main if new and CI green
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide and dispatch the production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: bash scripts/daily-deploy.sh
