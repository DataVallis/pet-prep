name: Daily production deploy

# D21 (David 2026-10-15) + D24 (David 2026-10-26): every day at 03:17 Europe/Ljubljana, deploy production when main has
# commits production does not run yet AND the push CI ("CI & Deploy") of the main head is
# green — by starting exactly the manual path: CI & Deploy → Run workflow on main, target
# production (full tests, deploy guard, deploy job, mobile OTA chain unchanged). Logic and
# rules: scripts/daily-deploy.sh (harness scripts/tests/daily-deploy.test.sh).
# GitHub cron is UTC only: 01:17 UTC = 03:17 CEST, 02:17 UTC = 03:17 CET; the script lets
# only the matching one through (judged by the cron string, so a late start still counts).
# Why 03:17 (D24): at 04:00 / 05:00 UTC GitHub started the runs 4.5–6 h late (deploy at
# 10:45–12:00 local); scheduled runs are best effort and :00 is the most congested minute,
# so the cron is earlier and off the hour. GitHub may still start it late. Turn it off: Actions → Daily production deploy → Disable workflow.

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the decision, dispatch nothing (false = deploy now if main is new and its push CI is green)'
        type: boolean
        default: true

concurrency:
  group: daily-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # gh workflow run deploy-production.yml (workflow_dispatch)

jobs:
  daily-deploy:
    name: Deploy main if new and CI green
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide and dispatch the production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: bash scripts/daily-deploy.sh
