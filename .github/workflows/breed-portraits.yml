# Generates the AI breed illustrations for the website animal register on the
# production server (it has FAL_AI_API_KEY; laptops / cloud sessions don't) and
# returns them as a workflow artifact. Manual only (David 2026-10-10). Uses the
# AI Lab budget. Nothing is published: after a run, download the artifact, review
# the images, commit them to docs/research/breed-portraits/ and run
# scripts/export-breed-registry.mjs --copy-portraits <website>/public (HANDOFF.md, M5-R11-04).
name: Breed portraits (AI, production server)

on:
  workflow_dispatch:
    inputs:
      breeds:
        description: "Breed keys, space separated (empty = all register breeds), e.g. labrador_retriever golden_retriever"
        required: false
        default: ""
      force:
        description: "Regenerate existing images (--force)"
        type: boolean
        default: false
      dry_run:
        description: "Only print prompts and cost (--dry-run)"
        type: boolean
        default: false

concurrency:
  group: breed-portraits
  cancel-in-progress: false

permissions:
  contents: write   # pushes the images to a review branch portraits/run-<id> (never main)

jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate on the production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST || '138.199.172.97' }}
          SSH_USER: ${{ secrets.PRODUCTION_USER || 'deploy' }}
          BREEDS: ${{ inputs.breeds }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then echo "PRODUCTION_SSH_PRIVATE_KEY missing"; exit 1; fi
          # Only breed keys (lower-case letters, digits, underscore) may reach the remote shell.
          ARGS=""
          for b in $BREEDS; do
            if ! [[ "$b" =~ ^[a-z0-9_]+$ ]]; then echo "invalid breed key: $b"; exit 1; fi
            ARGS="$ARGS --breed=$b"
          done
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          OPTS=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new)
          DC='docker compose -p backend -f /opt/petprep/repo/backend/compose.production.yaml'
          mkdir -p out
          # Action logs and artifacts can't be read from every client, so the output also
          # goes into one annotation per line and the images into a review branch.
          # shellcheck disable=SC2086
          ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "$DC exec -T --user 1000:1000 app php artisan breeds:portraits --out=storage/app/breed-portraits $ARGS" \
            2>&1 | tee out/run.log
          tail -n 40 out/run.log | while IFS= read -r line; do echo "::notice title=portraits::${line}"; done
          # Stream the folder straight out of the container's storage volume.
          mkdir -p out/images
          ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "$DC exec -T app sh -c 'test -d storage/app/breed-portraits && tar -C storage/app/breed-portraits -cf - . || true'" \
            | tar -C out/images -xf - || true
          find out -type f | sort
          echo "::notice title=portraits files::$(find out/images -type f | wc -l) file(s)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.dry_run }}
        with:
          path: repo

      - name: Push the images to a review branch
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(find out/images -type f -name '*.webp' 2>/dev/null)" ]; then echo "no images"; exit 0; fi
          mkdir -p repo/docs/research/breed-portraits
          cp -R out/images/. repo/docs/research/breed-portraits/
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "portraits/run-${RUN_ID}"
          git add docs/research/breed-portraits
          git commit -m "chore(research): AI breed portraits from run ${RUN_ID} [M5-R11]"
          git push origin "portraits/run-${RUN_ID}"
          echo "::notice title=portraits branch::portraits/run-${RUN_ID}"

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: breed-portraits-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
