# Generates the AI breed photos (realistic, M5-R11-05) for the website animal register on the
# production server (it has FAL_AI_API_KEY; laptops / cloud sessions don't) and
# returns them as a workflow artifact. Manual only (David 2026-10-10). Uses the
# AI Lab budget. Nothing is published: after a run, download the artifact, review
# the images, commit them to docs/research/breed-portraits/ and run
# scripts/export-breed-registry.mjs --copy-portraits <website>/public (HANDOFF.md, M5-R11-04).
# No production deploy needed (David 2026-10-19: "takoj ko se doda pasma na stran mora biti
# slika"): the command runs in a ONE-OFF container of the production image with app/, config/,
# lang/ and routes/ of `ref` (default: main) mounted read-only over the baked-in code. The live
# app / queue / scheduler containers keep running production's code untouched. The one-off
# container builds its own config cache from the mounted config (entrypoint.sh). Refused when
# `ref` changes composer.lock (new PHP dependencies need a real deploy first).
# `colours` (David 2026-10-26): colour variants instead of the default portraits — every
# standard coat colour of config/breed_colours.php except the default portrait's, edited from
# that portrait (`breeds:portraits --colours`). The reference portraits + manifest come from
# docs/research/breed-portraits of `ref`, shipped read-only next to the code
# (`--reference-dir`); output, review branch and artifact are the same as for portraits.
# `colour_keys` (space separated, with `colours`): only those colours (`--colour=<key>`), e.g.
# `blue-white` to redo one variant — an existing variant is replaced only with `force`.
name: Breed portraits (AI, production server)

on:
  workflow_dispatch:
    inputs:
      breeds:
        description: "Breed keys, space separated (empty = all register breeds), e.g. labrador_retriever golden_retriever"
        required: false
        default: ""
      force:
        description: "Regenerate existing images (--force)"
        type: boolean
        default: false
      colours:
        description: "Colour variants of the existing portraits (--colours, every other standard coat colour)"
        type: boolean
        default: false
      colour_keys:
        description: "With colours: only these colour keys of config/breed_colours.php, space separated (empty = every colour), e.g. blue-white. Existing variants still need force."
        required: false
        default: ""
      dry_run:
        description: "Only print prompts and cost (--dry-run)"
        type: boolean
        default: false
      ref:
        description: "Commit / branch whose breed code is used (empty = main). Need not be deployed."
        required: false
        default: ""

concurrency:
  group: breed-portraits
  cancel-in-progress: false

permissions:
  contents: write   # pushes the images to a review branch portraits/run-<id> (never main)

jobs:
  portraits:
    runs-on: ubuntu-latest
    # Production SSH key: from the `production` environment once David moves the secrets
    # there (DEPLOYMENT.md D20); repository secrets keep working until then.
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout the breed code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          path: code

      - name: Generate on the production server (one-off container, code of `ref`)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST || '138.199.172.97' }}
          SSH_USER: ${{ secrets.PRODUCTION_USER || 'deploy' }}
          BREEDS: ${{ inputs.breeds }}
          FORCE: ${{ inputs.force }}
          COLOURS: ${{ inputs.colours }}
          COLOUR_KEYS: ${{ inputs.colour_keys }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then echo "PRODUCTION_SSH_PRIVATE_KEY missing"; exit 1; fi
          # Only breed keys (lower-case letters, digits, underscore) may reach the remote shell.
          ARGS=""
          for b in $BREEDS; do
            if ! [[ "$b" =~ ^[a-z0-9_]+$ ]]; then echo "invalid breed key: $b"; exit 1; fi
            ARGS="$ARGS --breed=$b"
          done
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$COLOURS" = "true" ]; then ARGS="$ARGS --colours --reference-dir=/opt/breed-portraits-reference"; fi
          # Only colour keys (lower-case letters, digits, hyphen) may reach the remote shell.
          for k in $COLOUR_KEYS; do
            if [ "$COLOURS" != "true" ]; then echo "colour_keys needs colours"; exit 1; fi
            if ! [[ "$k" =~ ^[a-z0-9-]+$ ]]; then echo "invalid colour key: $k"; exit 1; fi
            ARGS="$ARGS --colour=$k"
          done
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then echo "invalid run id"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          OPTS=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new)
          DC='docker compose -p backend -f /opt/petprep/repo/backend/compose.production.yaml'
          IMG_PHP='docker run --rm --entrypoint sha256sum petprep-app:production'
          REMOTE="/tmp/petprep-portraits-${RUN_ID}"
          echo "::notice title=portraits code::$(git -C code rev-parse HEAD)"
          # New PHP dependencies are not in the production image → that needs a real deploy.
          want=$(sha256sum code/backend/composer.lock | cut -d' ' -f1)
          have=$(ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "$IMG_PHP /var/www/html/composer.lock" | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "::error title=portraits::composer.lock of ref differs from production — deploy first"; exit 1
          fi
          # Ship the code of `ref` (only the PHP sources the command loads).
          tar -C code/backend -czf - app config lang routes \
            | ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "rm -rf '$REMOTE' && mkdir -p '$REMOTE' && tar -C '$REMOTE' -xzf - && chmod -R a+rX '$REMOTE'"
          MOUNTS=""
          for d in app config lang routes; do MOUNTS="$MOUNTS -v $REMOTE/$d:/var/www/html/$d:ro"; done
          if [ "$COLOURS" = "true" ]; then
            # The default portraits of `ref` are the edit references (read-only, outside storage/).
            tar -C code/docs/research -czf - breed-portraits \
              | ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '$REMOTE/reference' && tar -C '$REMOTE/reference' -xzf - && chmod -R a+rX '$REMOTE/reference'"
            MOUNTS="$MOUNTS -v $REMOTE/reference/breed-portraits:/opt/breed-portraits-reference:ro"
          fi
          mkdir -p out
          # Action logs and artifacts can't be read from every client, so the output also
          # goes into one annotation per line and the images into a review branch.
          # shellcheck disable=SC2086
          set +e
          ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "$DC run --rm --no-deps -T $MOUNTS app php artisan breeds:portraits --out=storage/app/breed-portraits $ARGS" \
            2>&1 | tee out/run.log
          status=${PIPESTATUS[0]}
          set -e
          ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "rm -rf '$REMOTE'" || true
          tail -n 40 out/run.log | while IFS= read -r line; do echo "::notice title=portraits::${line}"; done
          if [ "$status" -ne 0 ]; then echo "::error title=portraits::breeds:portraits exited $status"; exit "$status"; fi
          # Stream the folder straight out of the container's storage volume.
          mkdir -p out/images
          ssh "${OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "$DC exec -T app sh -c 'test -d storage/app/breed-portraits && tar -C storage/app/breed-portraits -cf - . || true'" \
            | tar -C out/images -xf - || true
          find out -type f | sort
          echo "::notice title=portraits files::$(find out/images -type f | wc -l) file(s)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.dry_run }}
        with:
          path: repo

      - name: Push the images to a review branch
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(find out/images -type f -name '*.webp' 2>/dev/null)" ]; then echo "no images"; exit 0; fi
          mkdir -p repo/docs/research/breed-portraits
          cp -R out/images/. repo/docs/research/breed-portraits/
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "portraits/run-${RUN_ID}"
          git add docs/research/breed-portraits
          git commit -m "chore(research): AI breed portraits from run ${RUN_ID} [M5-R11]"
          git push origin "portraits/run-${RUN_ID}"
          echo "::notice title=portraits branch::portraits/run-${RUN_ID}"

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: breed-portraits-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
