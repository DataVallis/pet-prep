# PetPrep Production Docker Compose Configuration
# Single-server stack: Caddy (TLS, static files, pet media), Laravel on PHP-FPM,
# Reverb, Queue (default + broadcasts), Scheduler, PostgreSQL 18, Redis.
#
# Runtime (M4-05b, DEPLOYMENT.md D14): one production image built from
# docker/production/Dockerfile — target `app` (php-fpm, code + vendor baked in, no
# bind mount of the code) for app / reverb / queue / queue-broadcasts / scheduler,
# target `web` (Caddy + public/) for caddy. deploy-production.sh builds both as
# `:next` BEFORE maintenance mode and promotes them to `:production` after the
# code switch (`:previous` keeps the last release for the automatic revert).
# The old Sail image `petprep-backend:production` is left untouched for a rollback.
#
# Variables interpolated here come from backend/.env (copy of /opt/petprep/.env
# written by the deploy script) or the shell: PETPREP_IMAGE_TAG (default
# production), PET_MEDIA_SERVE_VIA (default caddy), PUSH_ENABLED (default true), DB_*.

x-php: &php
  image: petprep-app:${PETPREP_IMAGE_TAG:-production}
  restart: unless-stopped
  env_file:
    - /opt/petprep/.env
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    # Caddy sends the bytes of GET /api/media/{id} (X-Accel-Redirect); `php` = stream from PHP.
    PET_MEDIA_SERVE_VIA: ${PET_MEDIA_SERVE_VIA:-caddy}
    # Escalation pushes via Expo (M3-02); PUSH_ENABLED=false in /opt/petprep/.env silences them.
    PUSH_ENABLED: ${PUSH_ENABLED:-true}
  volumes:
    - /opt/petprep/.env:/var/www/html/.env:ro
    # storage/ only (logs, maintenance flag, pet media). Every PHP container runs
    # as uid 1000 — same owner as the files written in the Sail era.
    - app_storage:/var/www/html/storage
  networks:
    - petprep-network

services:
  caddy:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
    image: petprep-web:${PETPREP_IMAGE_TAG:-production}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /opt/petprep/.env
    volumes:
      - ../deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Pet media for X-Accel-Redirect (read-only; root = /srv/storage/app/pet-media).
      - app_storage:/srv/storage:ro
    networks:
      - petprep-network
    depends_on:
      - app
      - reverb

  app:
    <<: *php
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: app
    # Default CMD php-fpm (listens on 9000; Caddy → php_fastcgi app:9000).
    healthcheck:
      test: ["CMD", "php-fpm-ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    # Lets reverb close the open WebSocket connections cleanly on a deploy.
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3", "--timeout=90", "--sleep=3"]
    # > --timeout=90: a running fal.ai / media download job finishes on SIGTERM
    # instead of being killed after Docker's default 10 s.
    stop_grace_period: 100s
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Real-time PetUpdated delivery to Reverb (M1-09) and escalation pushes to Expo
  # (M3-02, `notifications` queue, after broadcasts). Separate from `queue` so a
  # slow fal.ai job never delays a broadcast or an alarm and a Reverb outage never
  # blocks fal.ai jobs. Push jobs set their own tries / backoff / timeout (≤ 60 s).
  queue-broadcasts:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=broadcasts,notifications", "--tries=3", "--backoff=2", "--timeout=15", "--sleep=1"]
    stop_grace_period: 65s
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    # A tick (decay, media:sweep) runs inside schedule:work's process tree.
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: 'postgres:18-alpine'
    restart: unless-stopped
    env_file:
      - /opt/petprep/.env
    environment:
      POSTGRES_DB: '${DB_DATABASE:-petprep_production}'
      POSTGRES_USER: '${DB_USERNAME:-petprep_user}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - petprep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-petprep_user} -d ${DB_DATABASE:-petprep_production}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:alpine'
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - petprep-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  petprep-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  app_storage:
  # Unused since M4-05b (caches live inside each container). Kept declared so a
  # rollback to the Sail runtime (previous compose file) finds its caches; remove
  # after the rollback window (DEPLOYMENT.md D14).
  app_bootstrap_cache:
