; PetPrep PHP-FPM pool (M4-05b). Replaces the official image's www.conf / docker.conf.
;
; Sizing for the Hetzner CX23 (2 vCPU, 4 GB RAM) shared with PostgreSQL, Redis,
; Reverb, two queue workers, the scheduler and Caddy: a Laravel + Filament worker
; is ~40-70 MB RSS (code itself lives once in OPcache shared memory), so 12
; children ≈ 0.5-0.85 GB worst case. Requests mostly wait on PostgreSQL / Redis
; (fal.ai calls are queued), so 12 is plenty for 2 vCPU. Raise only with RAM.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; The master already runs as the image user (petprep, uid 1000): no user/group.
listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycle workers now and then (guards against slow leaks in long-lived workers).
pm.max_requests = 500

; Hard stop for a stuck request (php.ini max_execution_time = 60 counts CPU time only).
request_terminate_timeout = 65s

; Keep the container env (docker compose env_file) visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Only reachable inside the container / Docker network: Caddy's php_fastcgi
; rewrites every non-file request to /index.php, so these paths never hit FPM
; from outside.
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status
