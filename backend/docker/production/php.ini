; PetPrep production PHP settings (M4-05b), loaded after php.ini-production.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; Env vars from docker compose (env_file) must reach Laravel in CLI and FPM.
variables_order = EGPCS
date.timezone = UTC

memory_limit = 256M
; FPM only (CLI ignores it); request_terminate_timeout in php-fpm.conf is the hard stop.
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 25M

; Laravel touches thousands of files per request: keep resolved paths cached.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: compiled code stays in shared memory and files are never re-checked.
; A deploy recreates the containers, which empties the cache (no stale code).
opcache.enable = 1
; CLI processes (queue, reverb, scheduler) are long-running or one-shot; no shared cache.
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Scramble / Filament read docblocks at runtime.
opcache.save_comments = 1
opcache.jit = disable
