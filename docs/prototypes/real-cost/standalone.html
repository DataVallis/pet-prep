<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koliko dela je labradorec? — PetPrep (prototip)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F5F2;--surface:#fff;--ink:#121614;--muted:#5A635D;--mint:#7FE0B4;--mint-text:#1A7A55;--warn:#8A6500;--line:#E1E6E1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;font-size:16px;line-height:1.45}
h1,h2,.num{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(28px,3.4vw,40px);line-height:1.05}
h2{font-size:clamp(24px,2.6vw,32px);line-height:1.1}
h1:focus,h2:focus{outline:none}
p{margin:0}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
#scene:active{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:16px 20px;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand svg{width:30px;height:30px}
.badge{font-size:13px;font-weight:600;color:var(--warn);background:#FFF4D1;border-radius:999px;padding:3px 10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
#lang{margin-left:auto}
.panel{position:fixed;left:20px;bottom:20px;width:min(400px,calc(100vw - 40px));max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);border-radius:22px;padding:24px;box-shadow:0 12px 40px rgba(18,22,20,.12);z-index:2;display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none}
.lede{color:var(--muted);font-size:17px}
.btn{border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px 18px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.mint{background:var(--mint);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--mint-text);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}
/* day HUD */
.dayhud{position:fixed;left:20px;right:20px;bottom:20px;z-index:2;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;pointer-events:none}
.dayhud[hidden]{display:none}
.dayhud>*{pointer-events:auto}
.clockcard{background:var(--ink);color:#fff;border-radius:22px;padding:14px 20px;min-width:230px}
#clock{font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
#caption{font-size:17px;font-weight:600;color:var(--mint);margin-top:6px;min-height:25px}
#caption.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{background:var(--surface);border-radius:16px;padding:10px 14px;min-width:84px;box-shadow:0 6px 20px rgba(18,22,20,.08)}
.chip span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.chip b{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-variant-numeric:tabular-nums}
/* summary */
#sum-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
#sum-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
#sum-list b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-style:normal;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.tag.src{background:#E3F7EE;color:var(--mint-text)}.tag.rule{background:#EEF0EE;color:var(--muted)}
#scale{align-self:flex-start}
#spots,#binlabel,#info{position:fixed;left:0;top:0;z-index:1}
.spot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font:italic 700 16px/1 Georgia,serif;cursor:pointer;box-shadow:0 4px 12px rgba(18,22,20,.18)}
.spot[aria-expanded="true"]{background:var(--ink);color:#fff}
#binlabel{background:var(--surface);border-radius:14px;padding:8px 12px;font-size:14px;box-shadow:0 6px 20px rgba(18,22,20,.1);display:flex;flex-direction:column;gap:2px;max-width:210px;pointer-events:none}
#binlabel strong{font-size:15px}
#binlabel span{color:var(--muted);font-weight:600}
#binlabel ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 10px}
#binlabel li{display:flex;align-items:center;gap:5px;white-space:nowrap}
#binlabel i{width:10px;height:10px;border-radius:50%;display:inline-block}
#info{z-index:4;width:250px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 32px rgba(18,22,20,.25)}
#info[hidden]{display:none}
#info strong{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;padding-right:28px}
#info p{font-size:15px}
#info small{font-size:13px;color:#A3ADA6}
#info-close{position:absolute;right:8px;top:6px;width:32px;height:32px;border:0;background:none;color:#fff;font-size:22px;cursor:pointer}
body[data-step="day"] #spots,body[data-step="day"] #info{display:none}
.sponsor a{font-weight:700;color:var(--ink);font-size:15px;margin-top:2px}
/* cost */
label.sl{display:flex;justify-content:space-between;font-weight:600}
label.sl output{font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.totals div{background:var(--bg);border-radius:14px;padding:10px 12px}
.totals span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.totals b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;white-space:nowrap}
.sponsor{border:1.5px dashed #B9C2BB;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sponsor small{font-size:12px;font-weight:700;color:var(--muted)}
.sponsor .plogo svg{display:block;width:132px;height:auto;margin:4px 0 2px}
.sponsor strong{font-size:16px}
.sponsor p{font-size:14px;color:var(--muted)}
.curbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
/* result */
#promise{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
#promise li{padding-left:30px;position:relative;font-weight:500}
#promise li::before{content:"";position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:6px;border:2px solid var(--ink)}
#lead{display:flex;flex-direction:column;gap:8px}
#lead input{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid #B9C2BB}
#lead label{font-weight:600;font-size:14px}
#lead-msg{color:var(--warn);font-weight:600;font-size:14px}
details{font-size:14px;color:var(--muted)}summary{cursor:pointer;font-weight:600;color:var(--ink)}
@media (max-width:760px){
  #info{width:calc(100vw - 16px)}
  .panel{left:12px;right:12px;bottom:12px;width:auto;max-height:58vh;padding:18px;border-radius:22px 22px 18px 18px}
  .top{padding:12px}
  .brand span.word{display:none}
  .dayhud{left:12px;right:12px;bottom:12px}
  .clockcard{flex:1 1 100%}
  #clock{font-size:42px}
  body[data-step="intro"] #scene,body[data-step="sum"] #scene,body[data-step="cost"] #scene,body[data-step="result"] #scene{height:52vh}
}
@media (prefers-reduced-motion:reduce){#caption.pop{animation:none}}
</style>
</head>

<header class="top">
